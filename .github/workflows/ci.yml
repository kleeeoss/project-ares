name: Ares CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-compute.txt"

      - name: Install Compute Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-compute.txt
          pip install pytest pytest-asyncio

      - name: Run Mathematical Invariant Tests
        run: |
          pytest tests/test_math.py -v

  build-containers:
    needs: test-invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Coordinator Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.coordinator
          push: false
          tags: ares-coordinator:test

      - name: Build Compute Node Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ares-compute:test