apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-compute
  namespace: ares
  labels:
    app: ares-compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ares-compute
  template:
    metadata:
      labels:
        app: ares-compute
    spec:
      containers:
        - name: compute-engine
          image: ares-ares_compute_node:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ares-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 5