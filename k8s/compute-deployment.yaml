apiVersion: apps/v1
kind: Deployment
metadata:
  name: ares-compute
  namespace: ares
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ares-compute
  template:
    metadata:
      labels:
        app: ares-compute
    spec:
      containers:
        - name: compute-worker
          image: ares-compute:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "compute_node:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          volumeMounts:
            - name: shard-storage
              mountPath: /data
      volumes:
        - name: shard-storage
          emptyDir: {}